name: Build Eclipse plugin

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $manifest = Get-Content 'META-INF\MANIFEST.MF'
          $bundleLine = $manifest | Where-Object { $_ -match '^Bundle-Version:\s*' } | Select-Object -First 1
          if (-not $bundleLine) { throw 'Bundle-Version not found in META-INF/MANIFEST.MF' }
          $manifestVersion = ($bundleLine -replace '^Bundle-Version:\s*', '').Trim()
          if ($manifestVersion -notmatch '^\d+\.\d+\.\d+([.-][0-9A-Za-z.-]+)?$') {
            throw "Unsupported Bundle-Version: $manifestVersion"
          }

          if ('${{ github.ref }}' -like 'refs/tags/v*') {
            $version = '${{ github.ref_name }}'.Substring(1)
            if ($version -ne $manifestVersion) {
              throw "Tag version $version does not match Bundle-Version $manifestVersion"
            }
          } else {
            $version = $manifestVersion
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "Resolved version: $version"

      - name: Download Eclipse IDE 2026-06
        shell: pwsh
        run: |
          $archive = Join-Path $PWD '.tools\eclipse.zip'
          $tools = Join-Path $PWD '.tools'
          New-Item -ItemType Directory -Force $tools | Out-Null
          $url = 'https://www.eclipse.org/downloads/download.php?file=/technology/epp/downloads/release/2026-06/R/eclipse-java-2026-06-R-win32-x86_64.zip&r=1'
          $attempts = 4
          for ($attempt = 1; $attempt -le $attempts; $attempt++) {
            try {
              if (Test-Path $archive) { Remove-Item $archive -Force }
              Write-Host "Downloading Eclipse (attempt $attempt/$attempts)..."
              Invoke-WebRequest -Uri $url -OutFile $archive -MaximumRetryCount 2 -RetryIntervalSec 3
              if ((Get-Item $archive).Length -lt 10MB) { throw "Downloaded Eclipse archive is unexpectedly small." }
              break
            } catch {
              if ($attempt -eq $attempts) { throw }
              $delay = [Math]::Min(20, 3 * $attempt)
              Write-Warning "Eclipse download failed: $($_.Exception.Message). Retrying in $delay seconds."
              Start-Sleep -Seconds $delay
            }
          }
          Expand-Archive -Path $archive -DestinationPath $tools

      - name: Compile, test and publish p2 repository
        shell: pwsh
        run: |
          .\build.ps1 -EclipseRoot "$PWD\.tools\eclipse" -JdkRoot $env:JAVA_HOME -Version "${{ steps.version.outputs.version }}"

      - name: Upload packaged extension
        uses: actions/upload-artifact@v4
        with:
          name: casla-eclipse-ai-assistant-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: pwsh
        run: |
          if (gh release view $env:RELEASE_TAG *> $null) {
            Write-Host "Release $env:RELEASE_TAG already exists; skipping publication."
            exit 0
          }

          $files = Get-ChildItem -Path dist -File | ForEach-Object { $_.FullName }
          gh release create $env:RELEASE_TAG $files `
            --target "${{ github.sha }}" `
            --title "Casla AI Code Assistant $env:RELEASE_VERSION" `
            --generate-notes
