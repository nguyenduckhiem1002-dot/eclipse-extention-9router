name: Build Eclipse plugin

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to publish a GitHub Release on a tag push; read-only otherwise

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download Eclipse IDE 2026-06
        shell: pwsh
        run: |
          $archive = Join-Path $PWD '.tools\eclipse.zip'
          $tools = Join-Path $PWD '.tools'
          New-Item -ItemType Directory -Force $tools | Out-Null
          $url = 'https://www.eclipse.org/downloads/download.php?file=/technology/epp/downloads/release/2026-06/R/eclipse-java-2026-06-R-win32-x86_64.zip&r=1'
          Invoke-WebRequest -Uri $url -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $tools

      # This runner's Eclipse is the plain public download, so it never has
      # SAP ABAP Development Tools installed (that requires SAP's own update
      # site). build.ps1 already handles that: it compiles and packages
      # everything except the one class that imports an ADT type, and ghost
      # text's ABAP support (the primary path) is unaffected either way.
      - name: Compile, test and publish p2 repository
        shell: pwsh
        run: |
          .\build.ps1 -EclipseRoot "$PWD\.tools\eclipse" -JdkRoot $env:JAVA_HOME

      - name: Upload packaged extension
        uses: actions/upload-artifact@v4
        with:
          name: casla-eclipse-ai-assistant-0.2.0
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path dist -File | ForEach-Object { $_.FullName }
          gh release create "${{ github.ref_name }}" $files --title "${{ github.ref_name }}" --generate-notes
