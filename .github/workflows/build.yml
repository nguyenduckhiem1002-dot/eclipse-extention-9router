name: Build Eclipse plugin

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download Eclipse IDE 2026-06
        shell: pwsh
        run: |
          $archive = Join-Path $PWD '.tools\eclipse.zip'
          $tools = Join-Path $PWD '.tools'
          New-Item -ItemType Directory -Force $tools | Out-Null
          $url = 'https://www.eclipse.org/downloads/download.php?file=/technology/epp/downloads/release/2026-06/R/eclipse-java-2026-06-R-win32-x86_64.zip&r=1'
          Invoke-WebRequest -Uri $url -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $tools

      - name: Compile, test and publish p2 repository
        shell: pwsh
        run: |
          .\build.ps1 -EclipseRoot "$PWD\.tools\eclipse" -JdkRoot $env:JAVA_HOME

      - name: Upload packaged extension
        uses: actions/upload-artifact@v4
        with:
          name: casla-eclipse-ai-assistant-0.1.0
          path: dist/*
          if-no-files-found: error
